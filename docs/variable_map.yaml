version: 0.2.0
timezone: Europe/Madrid
grid_minutes: 5
flow_zero_noise_floor: -0.05   # caudales en [-0.05, 0) -> 0
systems:
  "": RCE
  _RCEa: RCE-a
  _RCEb: RCE-b
groups:
  tanks: [t_hot_tank_c, t_cold_tank_c, t_cold_tank_l1_c, t_cold_tank_l2_c, t_cold_tank_l3_c]
  circuit: [t_circuit_1_c, t_circuit_2_c, t_rc_inlet_c, t_circuit_4_c, t_circuit_5_c, t_circuit_7_c, t_circuit_8_c, t_circuit_10_c, t_circuit_11_c, t_aux_tank_22_c, t_aux_tank_23_c, t_aux_tank_24_c]
  surface: [t_surface_1_c, t_surface_2_c, t_surface_3_c, t_surface_4_c, t_surface_5_c, t_surface_6_c]
  flow: [flow_rce_l_min, flow_collector_l_min]
  pressure: [p_circuit_1_bar, p_circuit_2_bar]
  ambient: [t_ambient_c, rh_ambient_pct, wind_speed_m_s]
  solar: [solar_global_w_m2]
  ir: [ir_net_w_m2, ir_raw_signal]
ranges:   # rango de referencia para el indicador de QC (el valor NUNCA se modifica).
  # Los límites inferiores toleran el offset de cero habitual de los sensores (solar nocturno ligeramente
  # negativo, HR 100,1 %, viento/presión -0,0x) para que el indicador señale anomalías reales, no ruido.
  degC: [-20, 110]
  L/min: [0, 10]
  bar: [-0.5, 6]
  "%": [0, 101]
  m/s: [-0.1, 40]
  W/m2_solar: [-20, 1400]
  W/m2_ir: [-300, 300]
codes:    # values that are error codes, not measurements: removed (NaN) before averaging; counted in daily_qc.codes_removed_n
  degC: [-20.0, -10.0]          # transmitter limit codes seen in 2025 (unsuffixed tags)
  raw: [996298.6]               # pyrgeometer raw-signal overflow (Dec 2023 - Jan 2024)
flag_periods:   # documented periods where a variable is measured but means something else (cell flag, value kept)
  - {variable: ir_net_w_m2, start: "2019-07-10 00:00", end: "2019-07-24 12:55", flag: definition_differs,
     note: "logger channel configured differently: positive values (+360 to +440 W/m2); from 2019-07-24 ~13:00 net loss is negative"}
variables:
  t_hot_tank_c:
    unit: degC
    description: Hot storage tank temperature (DHW tank, 150 L)
    sensor: Pt-100 RTD
    status: confirmed
    source_ref: "ai_rce/read_data.py (hot <- TempT6); drawings A7; data_catalog/01 §1"
    sources: {"2019": TempT6, "2023": TempT6, "2024": TempT6, "2025": TempT6}
  t_cold_tank_c:
    unit: degC
    description: Cold storage tank temperature (50 L)
    sensor: Pt-100 RTD
    status: confirmed
    source_ref: "ai_rce/read_data.py (cold <- TempT9); A7"
    sources: {"2019": TempT9, "2023": TempT9, "2024": TempT9, "2025": TempT9}
  t_cold_tank_l1_c: {unit: degC, description: "Cold tank stratification probe 1 (height pending)", sensor: Pt-100 RTD, status: pending, source_ref: "A1 (tank probes) [Hip]", sources: {"2025": TempT9_1}}
  t_cold_tank_l2_c: {unit: degC, description: "Cold tank stratification probe 2 (height pending)", sensor: Pt-100 RTD, status: pending, source_ref: "A1 [Hip]", sources: {"2025": TempT9_2}}
  t_cold_tank_l3_c: {unit: degC, description: "Cold tank stratification probe 3 (height pending)", sensor: Pt-100 RTD, status: pending, source_ref: "A1 [Hip]", sources: {"2025": TempT9_3}}
  t_surface_1_c: {unit: degC, description: "Panel surface probe 1 of 6 (position pending)", sensor: Pt-100 RTD, status: confirmed, source_ref: "A1: six surface temperature sensors", sources: {"2023": TempT3_1, "2024": TempT3_1, "2025": TempT3_1}}
  t_surface_2_c: {unit: degC, description: "Panel surface probe 2 of 6", sensor: Pt-100 RTD, status: confirmed, source_ref: "A1", sources: {"2023": TempT3_2, "2024": TempT3_2, "2025": TempT3_2}}
  t_surface_3_c: {unit: degC, description: "Panel surface probe 3 of 6 (A1: outlet, coldest)", sensor: Pt-100 RTD, status: confirmed, source_ref: "A1", sources: {"2023": TempT3_3, "2024": TempT3_3, "2025": TempT3_3}}
  t_surface_4_c: {unit: degC, description: "Panel surface probe 4 of 6", sensor: Pt-100 RTD, status: confirmed, source_ref: "A1", sources: {"2023": TempT3_4, "2024": TempT3_4, "2025": TempT3_4}}
  t_surface_5_c: {unit: degC, description: "Panel surface probe 5 of 6", sensor: Pt-100 RTD, status: confirmed, source_ref: "A1", sources: {"2023": TempT3_5, "2024": TempT3_5, "2025": TempT3_5}}
  t_surface_6_c: {unit: degC, description: "Panel surface probe 6 of 6", sensor: Pt-100 RTD, status: confirmed, source_ref: "A1", sources: {"2023": TempT3_6, "2024": TempT3_6, "2025": TempT3_6}}
  t_circuit_1_c: {unit: degC, description: "Circuit temperature T1 (physical location pending P&ID 22UDL03/25UDL01); 2019: collector inlet (approx. equivalence)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1, §7", sources: {"2019": TempT1, "2023": TempT1, "2024": TempT1, "2025": TempT1}}
  t_circuit_2_c: {unit: degC, description: "Circuit temperature T2 (location pending); 2019: RC outlet (approx. equivalence)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1, §7", sources: {"2019": TempT2, "2023": TempT2, "2024": TempT2, "2025": TempT2}}
  t_rc_inlet_c: {unit: degC, description: "RCE inlet temperature, 2019 logger tag RC_IN_TEMP (recovered in v0.2; absent in v0.1)", sensor: Pt-100 RTD, status: confirmed, source_ref: "2019 logger header Tag 4 [RC_IN_TEMP]", sources: {"2019": TempRCin}}
  t_circuit_4_c: {unit: degC, description: "Circuit temperature T4 (location pending)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1", sources: {"2023": TempT4, "2024": TempT4, "2025": TempT4}}
  t_circuit_5_c: {unit: degC, description: "Circuit temperature T5 (location pending)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1", sources: {"2023": TempT5, "2024": TempT5, "2025": TempT5}}
  t_circuit_7_c: {unit: degC, description: "Circuit temperature T7 (location pending; probe faults logged 2024-04-30, 2024-05-13)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1; diary", sources: {"2023": TempT7, "2024": TempT7, "2025": TempT7}}
  t_circuit_8_c: {unit: degC, description: "Circuit temperature T8 (location pending)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1", sources: {"2023": TempT8, "2024": TempT8, "2025": TempT8}}
  t_circuit_10_c: {unit: degC, description: "Circuit temperature T10 (location pending)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1", sources: {"2023": TempT10, "2024": TempT10, "2025": TempT10}}
  t_circuit_11_c: {unit: degC, description: "Circuit temperature T11 (location pending)", sensor: Pt-100 RTD, status: pending, source_ref: "data_catalog/01 §1", sources: {"2023": TempT11, "2024": TempT11, "2025": TempT11}}
  t_aux_tank_22_c: {unit: degC, description: "Auxiliary tank circuit T22 (demand emulation; pending)", sensor: Pt-100 RTD, status: pending, source_ref: "A7", sources: {"2025": TempT22}}
  t_aux_tank_23_c: {unit: degC, description: "Auxiliary tank circuit T23 (pending)", sensor: Pt-100 RTD, status: pending, source_ref: "A7", sources: {"2025": TempT23}}
  t_aux_tank_24_c: {unit: degC, description: "Auxiliary tank circuit T24 (pending)", sensor: Pt-100 RTD, status: pending, source_ref: "A7", sources: {"2025": TempT24}}
  flow_rce_l_min: {unit: L/min, description: "Volumetric flow through the RCE (loop 1)", sensor: "Schmidt Mess SDNC 503 (±4 %)", status: confirmed, source_ref: "A1 flowmeter; tags CauQ1", sources: {"2019": CauQ1, "2023": CauQ1, "2024": CauQ1, "2025": CauQ1}}
  flow_collector_l_min: {unit: L/min, description: "Volumetric flow of the collector loop (2019 campaign only)", sensor: flowmeter (2019 logger), status: confirmed, source_ref: "2019 tag FLOW_COL", sources: {"2019": CauQ_col}}
  p_circuit_1_bar: {unit: bar, description: "Circuit pressure, transmitter PT1", sensor: pressure transmitter, status: confirmed, source_ref: "A1: two pressure sensors; diary ~2-2.5 bar", sources: {"2023": PresPT1, "2024": PresPT1, "2025": PresPT1}}
  p_circuit_2_bar: {unit: bar, description: "Circuit pressure, transmitter PT2", sensor: pressure transmitter, status: confirmed, source_ref: "A1", sources: {"2023": PresPT2, "2024": PresPT2, "2025": PresPT2}}
  t_ambient_c: {unit: degC, description: "Outdoor air temperature", sensor: weather station, status: confirmed, source_ref: "tag TempExt / T_EXT", sources: {"2019": TempExt, "2023": TempExt, "2024": TempExt, "2025": TempExt}}
  rh_ambient_pct: {unit: "%", description: "Outdoor relative humidity", sensor: weather station, status: confirmed, source_ref: "tag HumExt / HR_EXT", sources: {"2019": HumExt, "2023": HumExt, "2024": HumExt, "2025": HumExt}}
  wind_speed_m_s: {unit: m/s, description: "Wind speed", sensor: weather station, status: confirmed, source_ref: "ai_rce/read_data.py (v_vent <- VelVent)", sources: {"2023": VelVent, "2024": VelVent, "2025": VelVent}}
  solar_global_w_m2: {unit: W/m2_solar, description: "Global solar irradiance from the solarimeter (mounting plane — horizontal or panel plane — to be confirmed by the team); sensor down in 2025", sensor: solarimeter (IO_SENSOR1_DATA), status: confirmed, source_ref: "ai_rce/read_data.py; tag SOLARIM (2019)", sources: {"2019": solar, "2022": solar, "2023": solar, "2024": solar, "2025": solar}}
  ir_net_w_m2: {unit: W/m2_ir, description: "Net longwave (infrared) radiation from the pyrgeometer, sign AS RECORDED (2019: negative = net loss to the sky); unified convention pending", sensor: "LP PIRG 01 DeltaOhm (±5 %)", status: pending, source_ref: "tag PYRG_NRAD (2019); E_FIR neto (2024-25)", sources: {"2019": ir_net, "2024": ir_net, "2025": ir_net}}
  ir_raw_signal: {unit: raw, description: "Pyrgeometer raw signal as exported (2023 and part of 2024); not converted to W/m2 (unit pending)", sensor: "LP PIRG 01 DeltaOhm", status: pending, source_ref: "tag Efir", sources: {"2022": ir_raw, "2023": ir_raw, "2024": ir_raw}}
not_harmonized:
  - {column: SEÑ_GEN_SENSOR, reason: undocumented radiometer field}
  - {column: TEMPC, reason: undocumented radiometer field}
  - {column: TEMPF, reason: undocumented radiometer field}
  - {column: VALORES_MEDIOS, reason: undocumented radiometer field}
  - {column: IO_BODY_TEMPERATURE, reason: undocumented radiometer field}
  - {column: IO_RAW_SENSOR1_DATA, reason: raw solarimeter signal, undocumented scale}
  - {column: solar_pyr, reason: duplicate solar field of unclear origin}
  - {column: $RT_OFF$_x, reason: WinCC logging marker}
  - {column: PreP21, reason: pressure point 21, unit unconfirmed}
